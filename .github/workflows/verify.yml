name: App regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-service.txt
      - run: python -m unittest discover -s server -p 'test_*.py' -v
      - run: pnpm test:personal
      - run: pnpm test:service
      - run: pnpm test:sync
      - run: node scripts/session-state-check.mjs
      - run: pnpm test:native-linking
      - run: pnpm typecheck
      - run: pnpm lint
